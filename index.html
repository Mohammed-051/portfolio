<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EBE7DD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080807" media="(prefers-color-scheme: dark)" />
    <style>div.intro{display:none}.rr-intro,.rr-intro div.intro{background:#EBE7DD}.rr-intro[data-mode=raster],.rr-intro[data-mode=raster] div.intro{background:#080807}.rr-intro div.intro{position:fixed;inset:0;z-index:100;display:flex}.rr-intro:not(.rr-intro-live) div.intro>*{visibility:hidden}html.veil::after{content:"";position:fixed;inset:0;z-index:999;background:#EBE7DD;transition:opacity .4s;animation:rr-veil 1ms 4s forwards}html.veil[data-mode=raster]::after{background:#080807}html.veil-off::after{opacity:0;pointer-events:none}html.calm.veil-off::after{transition:none}@keyframes rr-veil{to{visibility:hidden}}</style>

    <script id="rr-prepaint">(function(){var d=document.documentElement,c=d.classList,m,s;
try{m=localStorage.getItem("rr-mode");s=sessionStorage.getItem("rr-entered");if(m==="light")m="render";else if(m==="dark")m="raster";}catch(e){}
var sys=matchMedia("(prefers-color-scheme: dark)").matches?"raster":"render",k=m==="render"||m==="raster";
d.dataset.mode=k?m:sys;c.add("js");
var plain=location.pathname.replace(/\/+$/,"")==="/index";
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce)c.add("calm");else if(!plain)c.add("enhanced");
if(!plain&&(!s||/[?&]intro=1/.test(location.search))){c.add("rr-intro");history.scrollRestoration="manual";history.replaceState(null,"",location.pathname+location.search);scrollTo(0,0)}else if(!plain)c.add("veil");
setTimeout(function(){c.contains("booted")||c.add("rr-boot-timeout")},2600);})();</script>
    <meta name="description" content="Raster &amp; Render: the portfolio of Mohammed Parvez, a creator and developer in Dhaka, Bangladesh. B.Sc. CSE, final semester, Daffodil International University. President, AR/VR &amp; Game Development Lab." />
    <meta property="og:site_name" content="Raster &amp; Render" />
    <meta property="og:title" content="Raster &amp; Render" />
    <meta property="og:description" content="The portfolio of Mohammed Parvez, creator and developer in Dhaka, Bangladesh." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en" />
    <meta property="og:url" content="https://mohammedparvez.work/" />
    <meta property="og:image" content="https://mohammedparvez.work/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Raster &amp; Render</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div class="intro" data-ph="load" role="dialog" aria-modal="true" aria-labelledby="intro-h">
      <div class="intro__top"><p class="intro__name"><span class="mk" aria-hidden="true"></span>MOHAMMED PARVEZ</p><p class="intro__h" id="intro-h">Loading</p><button class="intro__snd" type="button" aria-pressed="false" data-sfx="toggle">Sound: Off</button></div>
      <div class="intro__pane" data-m="render" inert><span class="intro__l">Render</span><p class="intro__t">Ink on paper.</p><button class="intro__key" type="button" data-pick="render" data-sfx="intro">Enter in Render</button></div>
      <div class="intro__pane" data-m="raster" inert><span class="intro__l">Raster</span><p class="intro__t">Cells on a grid.</p><button class="intro__key" type="button" data-pick="raster" data-sfx="intro">Enter in Raster</button></div>
      <i class="intro__door"></i><i class="intro__door"></i><i class="intro__ln"></i>
      <span class="intro__n" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0</span><p class="intro__cap" aria-hidden="true"></p>
    </div>
    <div id="root"><!--rr-fallback--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
