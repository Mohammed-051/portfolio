name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # tsc -b runs inside the build, so this is also the type check
      - run: npm run build
      - run: node scripts/check-assets.mjs
      - run: node scripts/check-secrets.mjs
      - run: node scripts/check-bundle.mjs
      - run: node scripts/check-release.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  fast-path:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # checkout only for .lighthouserc.json; the site comes from the artifact
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - run: npx --yes @lhci/cli@0.14.0 autorun
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          # upload-artifact skips dot-directories unless told otherwise
          include-hidden-files: true
          retention-days: 3
